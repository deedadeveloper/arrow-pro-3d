name: Browser Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/arrow-pro-server.log 2>&1 &
          echo $! > /tmp/arrow-pro-server.pid

      - name: Run browser tests
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            page.on('requestfailed', request => {
              errors.push(`Request failed: ${request.url()} — ${request.failure()?.errorText || 'unknown'}`);
            });

            try {
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.waitForTimeout(500);

              const title = await page.title();
              if (title !== 'Arrow Pro 3D') throw new Error(`Unexpected title: ${title}`);

              const stats = await page.evaluate(() => ({
                level: document.querySelector('#level-num')?.textContent,
                shape: document.querySelector('#shape-name')?.textContent,
                arrows: document.querySelector('#cell-count')?.textContent,
                status: document.querySelector('#status')?.textContent,
                webgl: !!document.querySelector('#game-canvas')?.getContext('webgl2'),
                canvasTag: document.querySelector('#game-canvas')?.tagName
              }));

              if (stats.canvasTag !== 'CANVAS') throw new Error(`3D canvas missing: ${JSON.stringify(stats)}`);
              if (!stats.webgl) throw new Error('WebGL2 context was not available');
              if (!stats.shape || stats.shape === '—') throw new Error(`Tower shape did not render: ${JSON.stringify(stats)}`);
              if (!stats.arrows || !stats.arrows.includes('/')) throw new Error(`Arrow count did not render: ${stats.arrows}`);

              const generatorResults = await page.evaluate(() => {
                const results = [];
                for (let level = 1; level <= 20; level++) {
                  const tower = window.ArrowTowerGenerator.generateTower({ level, seed: `browser-test-${level}` });
                  const puzzle = window.ArrowPuzzleGenerator.generate({ tower, level, seed: `browser-test-${level}` });
                  results.push({
                    level,
                    shape: tower.type,
                    cells: tower.cells.length,
                    arrows: puzzle.arrows.length,
                    solvable: window.ArrowPuzzleGenerator.isSolvable(puzzle.arrows, puzzle.bounds),
                    boundsValid: tower.cells.every(c =>
                      c.x >= 0 && c.x < tower.bounds.width &&
                      c.y >= 0 && c.y < tower.bounds.height &&
                      c.z >= 0 && c.z < tower.bounds.depth
                    )
                  });
                }
                return results;
              });
              if (generatorResults.some(r => !r.cells || r.arrows < 2 || !r.solvable || !r.boundsValid)) {
                throw new Error(`Generator regression: ${JSON.stringify(generatorResults.filter(r => !r.cells || r.arrows < 2 || !r.solvable || !r.boundsValid))}`);
              }

              await page.getByRole('button', { name: /Random Shape/ }).click();
              await page.waitForTimeout(100);
              const afterRandom = await page.locator('#cell-count').textContent();
              if (!afterRandom.includes('/')) throw new Error('Random shape interaction failed');

              await page.getByRole('button', { name: /Next/ }).click();
              await page.waitForTimeout(100);
              const nextLevel = await page.locator('#level-num').textContent();
              if (nextLevel !== '2') throw new Error(`Next level failed: ${nextLevel}`);

              await page.getByRole('button', { name: /Prev/ }).click();
              const previousLevel = await page.locator('#level-num').textContent();
              if (previousLevel !== '1') throw new Error(`Previous level failed: ${previousLevel}`);

              await page.getByRole('button', { name: /Auto Spin/ }).click();
              if (!(await page.locator('#spin-btn').textContent()).includes('Stop Spin')) {
                throw new Error('Auto-spin did not toggle on');
              }
              await page.getByRole('button', { name: /Stop Spin/ }).click();

              await page.locator('#level-input').fill('5');
              await page.getByRole('button', { name: /Load Level/ }).click();
              const loadedLevel = await page.locator('#level-num').textContent();
              if (loadedLevel !== '5') throw new Error(`Load level failed: ${loadedLevel}`);

              console.log(JSON.stringify({
                result: 'PASS',
                title,
                initial: stats,
                proceduralLevelsTested: generatorResults.length,
                generatorResults,
                afterRandom,
                nextLevel,
                previousLevel,
                loadedLevel,
                browserErrors: errors
              }, null, 2));

              if (errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/arrow-pro-server.pid ]; then kill "$(cat /tmp/arrow-pro-server.pid)" || true; fi
          cat /tmp/arrow-pro-server.log || true
