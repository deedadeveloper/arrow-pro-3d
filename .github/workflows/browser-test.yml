name: Browser Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/arrow-pro-server.log 2>&1 &
          echo $! > /tmp/arrow-pro-server.pid

      - name: Run browser tests
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            page.on('requestfailed', request => {
              errors.push(`Request failed: ${request.url()} — ${request.failure()?.errorText || 'unknown'}`);
            });

            try {
              await page.goto('http://127.0.0.1:4173/?test=1', { waitUntil: 'networkidle' });
              await page.waitForTimeout(500);

              const title = await page.title();
              if (title !== 'Arrow Pro 3D') throw new Error(`Unexpected title: ${title}`);

              const stats = await page.evaluate(() => ({
                level: document.querySelector('#level-num')?.textContent,
                shape: document.querySelector('#shape-name')?.textContent,
                arrows: document.querySelector('#cell-count')?.textContent,
                status: document.querySelector('#status')?.textContent,
                webgl: !!document.querySelector('#game-canvas')?.getContext('webgl2'),
                canvasTag: document.querySelector('#game-canvas')?.tagName
              }));

              if (stats.canvasTag !== 'CANVAS') throw new Error(`3D canvas missing: ${JSON.stringify(stats)}`);
              if (!stats.webgl) throw new Error('WebGL2 context was not available');
              if (!stats.shape || stats.shape === '—') throw new Error(`Tower shape did not render: ${JSON.stringify(stats)}`);
              if (!stats.arrows || !stats.arrows.includes('/')) throw new Error(`Arrow count did not render: ${stats.arrows}`);

              const interactionState = await page.evaluate(() => window.__ARROW_PRO_TEST__?.getState());
              if (!interactionState) throw new Error('Arrow interaction test hooks were not enabled');

              await page.evaluate(() => window.__ARROW_PRO_TEST__.reloadLevel(1));
              const forcedBlocked = await page.evaluate(() => window.__ARROW_PRO_TEST__.forceBlockedScenario());
              if (!forcedBlocked) throw new Error('Could not prepare blocked-arrow test scenario');
              await page.waitForTimeout(100);
              const blockedMoveHandled = await page.evaluate(() => window.__ARROW_PRO_TEST__.triggerBlockedFeedback());
              if (!blockedMoveHandled) throw new Error('Blocked-move handler did not show blocked feedback');
              const blockedClickTest = 'PASS (blocked-move handler; synthetic obstruction)';
              const blockedClickSeed = 'test-hook-forced-blockage';
              const blockedStatus = await page.locator('#status').textContent();
              if (!blockedStatus.includes('Blocked')) throw new Error(`Blocked status missing: ${blockedStatus}`);
              await page.waitForTimeout(330);
              const recoveredBlockedStatus = await page.locator('#status').textContent();
              if (recoveredBlockedStatus.includes('Blocked')) {
                throw new Error(`Blocked-arrow feedback did not clear: ${recoveredBlockedStatus}`);
              }

              await page.evaluate(() => window.__ARROW_PRO_TEST__.reloadLevel(1));
              await page.waitForTimeout(100);
              let clickRemovals = 0;
              let actualClickSolve = false;
              for (let attempt = 0; attempt < 20; attempt++) {
                const before = await page.evaluate(() => window.__ARROW_PRO_TEST__.getState());
                const remainingBefore = before.arrows.filter(arrow => !arrow.removed).length;
                if (remainingBefore === 0) {
                  actualClickSolve = true;
                  break;
                }
                const target = before.arrows.find(arrow =>
                  !arrow.removed && !arrow.animating && arrow.canSlide &&
                  arrow.x > 0 && arrow.x < 1280 &&
                  arrow.y > 0 && arrow.y < 900
                );
                if (!target) throw new Error(`No clickable removable arrow found; remaining=${remainingBefore}`);
                await page.mouse.click(target.x, target.y);
                await page.waitForTimeout(750);
                const after = await page.evaluate(() => window.__ARROW_PRO_TEST__.getState());
                const remainingAfter = after.arrows.filter(arrow => !arrow.removed).length;
                if (remainingAfter < remainingBefore) {
                  clickRemovals++;
                } else {
                  throw new Error(`Arrow click did not remove the selected arrow; before=${remainingBefore}, after=${remainingAfter}, status=${after.status}`);
                }
              }
              const finalClickState = await page.evaluate(() => window.__ARROW_PRO_TEST__.getState());
              actualClickSolve = finalClickState.arrows.every(arrow => arrow.removed);
              if (!actualClickSolve) {
                throw new Error(`Could not clear level through real pointer clicks; removed=${clickRemovals}, remaining=${finalClickState.arrows.filter(arrow => !arrow.removed).length}, status=${finalClickState.status}`);
              }

              const multiLevelClickResults = [];
              for (const level of [2, 3, 5]) {
                await page.evaluate(level => window.__ARROW_PRO_TEST__.reloadLevel(level), level);
                await page.waitForTimeout(100);
                let removedCount = 0;
                for (let click = 0; click < 50; click++) {
                  const state = await page.evaluate(() => window.__ARROW_PRO_TEST__.getState());
                  const remaining = state.arrows.filter(arrow => !arrow.removed).length;
                  if (remaining === 0) break;
                  const target = state.arrows.find(arrow =>
                    !arrow.removed && !arrow.animating && arrow.canSlide &&
                    arrow.x > 0 && arrow.x < 1280 &&
                    arrow.y > 0 && arrow.y < 900
                  );
                  if (!target) throw new Error(`Level ${level}: no visible movable arrow with ${remaining} remaining`);
                  await page.mouse.click(target.x, target.y);
                  await page.waitForTimeout(750);
                  const after = await page.evaluate(() => window.__ARROW_PRO_TEST__.getState());
                  const remainingAfter = after.arrows.filter(arrow => !arrow.removed).length;
                  if (remainingAfter >= remaining) {
                    throw new Error(`Level ${level}: arrow click failed to reduce count (${remaining} -> ${remainingAfter})`);
                  }
                  removedCount++;
                }
                const finalState = await page.evaluate(() => window.__ARROW_PRO_TEST__.getState());
                const remaining = finalState.arrows.filter(arrow => !arrow.removed).length;
                if (remaining !== 0 || !finalState.solved) {
                  throw new Error(`Level ${level} was not cleared through clicks; remaining=${remaining}; status=${finalState.status}`);
                }
                multiLevelClickResults.push({ level, removedCount, solved: true });
              }

              const generatorResults = await page.evaluate(() => {
                const results = [];
                for (let level = 1; level <= 20; level++) {
                  const tower = window.ArrowTowerGenerator.generateTower({ level, seed: `browser-test-${level}` });
                  const puzzle = window.ArrowPuzzleGenerator.generate({ tower, level, seed: `browser-test-${level}` });
                  results.push({
                    level,
                    shape: tower.type,
                    cells: tower.cells.length,
                    arrows: puzzle.arrows.length,
                    solvable: window.ArrowPuzzleGenerator.isSolvable(puzzle.arrows, puzzle.bounds),
                    boundsValid: tower.cells.every(c =>
                      c.x >= 0 && c.x < tower.bounds.width &&
                      c.y >= 0 && c.y < tower.bounds.height &&
                      c.z >= 0 && c.z < tower.bounds.depth
                    )
                  });
                }
                return results;
              });
              if (generatorResults.some(r => !r.cells || r.arrows < 2 || !r.solvable || !r.boundsValid)) {
                throw new Error(`Generator regression: ${JSON.stringify(generatorResults.filter(r => !r.cells || r.arrows < 2 || !r.solvable || !r.boundsValid))}`);
              }

              await page.evaluate(() => window.__ARROW_PRO_TEST__.reloadLevel(1));
              await page.waitForTimeout(100);
              await page.getByRole('button', { name: /Random Shape/ }).click();
              await page.waitForTimeout(100);
              const afterRandom = await page.locator('#cell-count').textContent();
              if (!afterRandom.includes('/')) throw new Error('Random shape interaction failed');

              await page.getByRole('button', { name: /Next/ }).click();
              await page.waitForTimeout(100);
              const nextLevel = await page.locator('#level-num').textContent();
              if (nextLevel !== '2') throw new Error(`Next level failed: ${nextLevel}`);

              await page.getByRole('button', { name: /Prev/ }).click();
              const previousLevel = await page.locator('#level-num').textContent();
              if (previousLevel !== '1') throw new Error(`Previous level failed: ${previousLevel}`);

              await page.getByRole('button', { name: /Auto Spin/ }).click();
              if (!(await page.locator('#spin-btn').textContent()).includes('Stop Spin')) {
                throw new Error('Auto-spin did not toggle on');
              }
              await page.getByRole('button', { name: /Stop Spin/ }).click();

              await page.locator('#level-input').fill('5');
              await page.getByRole('button', { name: /Load Level/ }).click();
              const loadedLevel = await page.locator('#level-num').textContent();
              if (loadedLevel !== '5') throw new Error(`Load level failed: ${loadedLevel}`);

              console.log(JSON.stringify({
                result: 'PASS',
                title,
                initial: stats,
                blockedClickTest,
                blockedClickSeed,
                recoveredBlockedStatus,
                clickRemovals,
                actualClickSolve,
                multiLevelClickResults,
                proceduralLevelsTested: generatorResults.length,
                generatorResults,
                afterRandom,
                nextLevel,
                previousLevel,
                loadedLevel,
                browserErrors: errors
              }, null, 2));

              if (errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/arrow-pro-server.pid ]; then kill "$(cat /tmp/arrow-pro-server.pid)" || true; fi
          cat /tmp/arrow-pro-server.log || true
